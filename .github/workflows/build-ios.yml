name: Build iOS App

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'TrainingLog/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          else
            echo "Xcode_16.2.app not found; using runner default:"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec TrainingLog/project.yml --project TrainingLog

      - name: Build (unsigned archive)
        run: |
          xcodebuild archive \
            -project TrainingLog/TrainingLog.xcodeproj \
            -scheme TrainingLog \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TrainingLog.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/TrainingLog.xcarchive/Products/Applications/TrainingLog.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: $APP_PATH not found — archive did not produce the app bundle." >&2
            ls -R build || true
            exit 1
          fi
          STAGING="$(mktemp -d)"
          mkdir -p "$STAGING/Payload"
          cp -R "$APP_PATH" "$STAGING/Payload/"
          (cd "$STAGING" && zip -qry TrainingLog-unsigned.ipa Payload)
          mv "$STAGING/TrainingLog-unsigned.ipa" .
          ls -lh TrainingLog-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrainingLog-unsigned-ipa
          path: TrainingLog-unsigned.ipa
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TrainingLog-unsigned.ipa
          generate_release_notes: true
